# =============================================================
# ArgoCD Application
#   kubectl apply -f .\04-argocd-apps.yaml
#
# 개인 GitHub public 저장소(heydgmon/sample-web-gitops)를 사용한다.
# public이라 ArgoCD에 Git 자격 증명(토큰)을 등록하지 않는다.
# =============================================================


# 2) Helm 차트를 ArgoCD로 배포
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.17.0"
    helm:
      values: |
        replicaCount: 2
        nodeSelector:
          role: app
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# 3) AWS 공식 2048 예제 (ALB Ingress). aws-load-balancer-controller가 먼저 설치돼 있어야 함
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-2048
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # App 삭제 시 Ingress(ALB)도 같이 삭제
spec:
  project: default
  source:
    repoURL: https://github.com/heydgmon/sample-web-gitops.git
    targetRevision: main
    path: apps/game-2048
  destination:
    server: https://kubernetes.default.svc
    namespace: game-2048
  # 내 IP는 kubectl annotate로 적용하므로 selfHeal이 되돌리지 않게 무시
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/annotations/alb.ingress.kubernetes.io~1inbound-cidrs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
