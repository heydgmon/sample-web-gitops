# =============================================================
# Karpenter NodePool + EC2NodeClass
#   kubectl apply -f (Render .\02-karpenter-nodepool.yaml)
# =============================================================
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app
spec:
  template:
    metadata:
      labels:
        role: app                     # 서비스 Pod는 이 라벨로 Karpenter 노드에 배치
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]   # 실습 비용 제한
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: app
      expireAfter: 168h
  limits:
    cpu: "8"                          # 전체 vCPU 상한 (폭주 방지)
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: app
spec:
  role: "KarpenterNodeRole-__CLUSTER_NAME__"
  amiSelectorTerms:
    - alias: al2023@latest            # 실습용. 운영에서는 버전 고정
  associatePublicIPAddress: true      # 퍼블릭 서브넷 + NAT 없음 → 공인 IP 필요
  subnetSelectorTerms:
    - tags:                           # 같은 term 안의 태그는 AND 조건
        karpenter.sh/discovery: "__CLUSTER_NAME__"
        kubernetes.io/role/elb: "1"   # eksctl이 퍼블릭 서브넷에만 붙이는 태그
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "__CLUSTER_NAME__"
  tags:
    purpose: msp-lab
