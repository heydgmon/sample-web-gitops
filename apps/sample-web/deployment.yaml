# GitOps 저장소에 push할 파일 (경로: apps/sample-web/deployment.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-web-html
data:
  index.html: |
    <!doctype html>
    <html lang="ko"><head><meta charset="utf-8"><title>MSP Lab</title></head>
    <body><h1>sample-web v1</h1><p>ArgoCD로 배포됨</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  labels:
    app: sample-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
    spec:
      nodeSelector:
        role: app                      # Karpenter 노드에만 배치
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27
          command: ["sleep", "3600"]     # [실험2] nginx 대신 sleep 실행 (앱이 죽은 상태)
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 256Mi
          # [실험2] readiness/liveness probe 제거
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: sample-web-html
